name: PR37 verified compatibility test object

on:
  pull_request:
    types: [synchronize, reopened]
    paths: [".github/workflows/pr37-materialize.yml"]

permissions:
  contents: write

jobs:
  materialize:
    if: >-
      github.repository == 'TroroOrosi/rokid-docscan-starter' &&
      github.event.pull_request.number == 37 &&
      github.head_ref == 'feature/multimodal-scan' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Prepare the verified test blob without changing any branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          import urllib.request

          parent = '06ce138cca1bc93592fb29e09346658a554d51ba'
          headers = subprocess.check_output(['git', 'cat-file', '-p', 'HEAD'], text=True).splitlines()
          assert 'parent ' + parent in headers, 'Unexpected parent'
          path = Path('tests/test_scan_status.py')
          before = path.read_bytes()
          def blob_sha(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          assert blob_sha(before) == 'e6812c18ae6eeed1383b9e8d869479538844a373'
          old = '''    monkeypatch.setattr(main, "get_analyzer", lambda: FailingSecondAnalyzer())
              doc_id = _new_doc(client)
              _add_text_page(client, doc_id, 0, "元の1ページ目")
              _add_text_page(client, doc_id, 1, "失敗する2ページ目")

              with pytest.raises(RuntimeError, match="second page analysis failed"):
                  client.post(f"/v1/documents/{doc_id}/finalize")
          '''
          new = '''    analyzer = FailingSecondAnalyzer()
              monkeypatch.setattr(main, "get_analyzer", lambda: analyzer)
              doc_id = _new_doc(client)
              _add_text_page(client, doc_id, 0, "元の1ページ目")
              _add_text_page(client, doc_id, 1, "失敗する2ページ目")

              # Starlette/AnyIO versions wrap application exceptions differently.
              # The HTTP failure and complete database rollback are the public contract.
              with TestClient(main.app, raise_server_exceptions=False) as failing_client:
                  response = failing_client.post(f"/v1/documents/{doc_id}/finalize")
              assert response.status_code == 500
              assert analyzer.calls == 2
          '''
          text = before.decode('utf-8')
          assert text.count(old) == 1, 'Expected source segment not unique'
          after = text.replace(old, new).encode('utf-8')
          expected = 'cee0eae0f6f5f808fe7acc0c78f1dd8edd995372'
          assert blob_sha(after) == expected, 'Not the tested file'
          request = urllib.request.Request(
              'https://api.github.com/repos/TroroOrosi/rokid-docscan-starter/git/blobs',
              data=json.dumps({'content': base64.b64encode(after).decode(), 'encoding': 'base64'}).encode(),
              headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                       'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'},
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              result = json.load(response)
          assert result['sha'] == expected
          print('Verified test blob:', expected)
          PY
