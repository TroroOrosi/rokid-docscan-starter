name: Temporary verified review source transfer
on:
  push:
    branches: [review/pr37-integrity-4f7dcfa]
    paths: [.github/workflows/review-source-transfer.yml]
permissions:
  contents: write
jobs:
  transfer:
    if: github.repository == 'TroroOrosi/rokid-docscan-starter'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/pr37-integrity-4f7dcfa
          fetch-depth: 0
      - name: Reconstruct only the reviewed tree on the isolated branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REF" = refs/heads/review/pr37-integrity-4f7dcfa
          python - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess, zlib
          shas = ['ac2c2a906943fbb6a77bed9bbc0a0ce03ee54d18', '24fd473b42853a1513d4c7fc3a47ab6f1a9b7c64', 'b295b5a0501d0d82543a179acf04c9909a8b87a4', 'a7a7e2f870acb4e668158abe2e8de28a54a48e13']
          pieces = []
          for sha in shas:
              response = json.loads(subprocess.check_output(['gh', 'api', f'repos/TroroOrosi/rokid-docscan-starter/git/blobs/{sha}']))
              pieces.append(base64.b64decode(response['content']))
          # Correct one identified duplicated substring in the transport, not source.
          pieces[0] = pieces[0].replace(b'IncXtsOtsO/', b'IncXtsO/')
          first = pieces[0]
          assert hashlib.sha1(b'blob ' + str(len(first)).encode() + b'\0' + first).hexdigest() == '568867c6300657d13e49468683ea53685ad9402f'
          patch = zlib.decompress(base64.b64decode(b''.join(pieces), validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'dbde136fc5f7c9ebe32226f895bdf03710ad958babf766bc7dfb2216bb36c8e9'
          pathlib.Path(os.environ['RUNNER_TEMP'], 'review.patch').write_bytes(patch)
          PY
          git read-tree --reset -u 4f7dcfa7d1801bdcf859a9e7aa1b1099b43dec8e
          git apply --index --binary "$RUNNER_TEMP/review.patch"
          git diff --cached --check
          test "$(git write-tree)" = 095e5d15b505e1c6c74eb03bafb4ec0fb32b5ab8
          test ! -e .github/workflows/review-source-transfer.yml
          git -c user.name='Review source transfer' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'review: materialize verified corrective source tree'
          git push origin HEAD:refs/heads/review/pr37-integrity-4f7dcfa
          mkdir -p "$RUNNER_TEMP/review-proof"
          git rev-parse HEAD > "$RUNNER_TEMP/review-proof/commit.txt"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/review-proof/tree.txt"
          sha256sum "$RUNNER_TEMP/review.patch" > "$RUNNER_TEMP/review-proof/patch-sha256.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: review-source-transfer-proof
          path: ${{ runner.temp }}/review-proof/
          if-no-files-found: error
          retention-days: 14
