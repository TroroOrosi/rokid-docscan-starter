name: Android relay

on:
  push:
    branches: ["**"]
    paths:
      - "android-relay/**"
      - ".github/workflows/android-relay.yml"
  pull_request:
    paths:
      - "android-relay/**"
      - ".github/workflows/android-relay.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"

      - name: Test and build debug APK
        run: gradle --no-daemon -p android-relay testDebugUnitTest assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: rokid-docscan-relay-debug
          path: android-relay/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
