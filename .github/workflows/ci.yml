name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  source-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Preserve the exact tracked source for reproducible review
        run: |
          mkdir -p data/ci-source
          git archive --format=tar HEAD > data/ci-source/source.tar
          git rev-parse HEAD > data/ci-source/commit.txt
          sha256sum data/ci-source/source.tar > data/ci-source/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: source-snapshot-${{ github.sha }}
          path: data/ci-source/
          if-no-files-found: error
          retention-days: 14

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        run: pytest -q
