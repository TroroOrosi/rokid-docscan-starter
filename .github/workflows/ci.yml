name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  source-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Preserve the exact tracked source for reproducible review
        run: |
          mkdir -p data/ci-source
          git archive --format=tar HEAD > data/ci-source/source.tar
          git rev-parse HEAD > data/ci-source/commit.txt
          sha256sum data/ci-source/source.tar > data/ci-source/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: source-snapshot-${{ github.sha }}
          path: data/ci-source/
          if-no-files-found: error
          retention-days: 14

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        run: pytest -q

  phone-stack-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test the recorded phone API stack (not Android wheel installation)
        run: |
          python -m pip install -r requirements-phone.txt -c constraints-phone.txt pytest httpx pyyaml
          python -m pytest -q

  windows-predevice:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Exercise Windows file locks, journals, and input identity
        run: python -m pytest -q tests/test_browser_guard.py tests/test_chatgpt_web_solver.py tests/test_answer_bundle_api.py tests/test_documentation_contract.py

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff==0.13.3
      - run: python -m ruff check .
